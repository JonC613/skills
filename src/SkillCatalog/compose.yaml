services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skillcatalog
      POSTGRES_USER: skillcatalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillcatalog -d skillcatalog"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: src/SkillCatalog/api/SkillCatalog.Api/Dockerfile
      target: migrator
    environment:
      ConnectionStrings__GitHubSubmissions: Host=postgres;Database=skillcatalog;Username=skillcatalog;Password=${POSTGRES_PASSWORD:-development-only}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: src/SkillCatalog/api/SkillCatalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__GitHubSubmissions: Host=postgres;Database=skillcatalog;Username=skillcatalog;Password=${POSTGRES_PASSWORD:-development-only}
      SkillCatalog__RepositoryRoot: /repo
      GitHubSubmission__DataProtectionKeyPath: /keys
      GitHubSubmission__AllowedOrigins__0: http://localhost:5173
    volumes:
      - data-protection-keys:/keys
    ports:
      - "5102:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: src/SkillCatalog/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
  data-protection-keys:
